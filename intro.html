<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #2d104a 0%, #4b1d68 30%, #7427a0 70%, #b785ff 100%);
            overflow: hidden;
        }

        .paper-pop {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .paper {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            opacity: 0;
            animation: paperBurst 1.2s ease forwards;
            background: rgba(255,255,255,0.35);
        }

        .paper:nth-child(1) { left: 10%; top: 18%; background: #e9d5ff; animation-delay: 0.1s; }
        .paper:nth-child(2) { left: 20%; top: 10%; background: #d8b4fe; animation-delay: 0.2s; }
        .paper:nth-child(3) { left: 35%; top: 22%; background: #c084fc; animation-delay: 0.3s; }
        .paper:nth-child(4) { left: 48%; top: 14%; background: #f5d0fe; animation-delay: 0.4s; }
        .paper:nth-child(5) { left: 62%; top: 24%; background: #ddd6fe; animation-delay: 0.5s; }
        .paper:nth-child(6) { left: 74%; top: 18%; background: #e9d5ff; animation-delay: 0.6s; }
        .paper:nth-child(7) { left: 84%; top: 32%; background: #c4b5fd; animation-delay: 0.7s; }
        .paper:nth-child(8) { left: 18%; top: 72%; background: #f0abfc; animation-delay: 0.8s; }
        .paper:nth-child(9) { left: 31%; top: 76%; background: #ddd6fe; animation-delay: 0.9s; }
        .paper:nth-child(10) { left: 47%; top: 80%; background: #d8b4fe; animation-delay: 1.0s; }
        .paper:nth-child(11) { left: 60%; top: 74%; background: #e9d5ff; animation-delay: 1.1s; }
        .paper:nth-child(12) { left: 77%; top: 78%; background: #c084fc; animation-delay: 1.2s; }

        .card {
            position: relative;
            z-index: 1;
            width: min(760px, 90vw);
            padding: 55px 30px 40px;
            border-radius: 28px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.28);
            box-shadow: 0 25px 60px rgba(16, 5, 28, 0.35);
            text-align: center;
            animation: pageEnter 0.9s ease-out;
        }

        .heart {
            font-size: 6rem;
            margin-bottom: 12px;
            color: #f8d7ff;
            text-shadow: 0 0 25px rgba(255,255,255,0.6);
            animation: pulseHeart 1.8s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(2.4rem, 6vw, 5rem);
            margin: 0;
            color: #f5ebff;
            letter-spacing: 1px;
        }

        p {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: #fff;
            margin: 18px auto 0;
            max-width: 540px;
            line-height: 1.8;
        }

        .balloon-btn {
            position: relative;
            width: 140px;
            height: 160px;
            margin-top: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            background: linear-gradient(180deg, #efb8ff, #9e5df3);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: 0 12px 22px rgba(32, 8, 46, 0.28);
            animation: floatBalloon 3s ease-in-out infinite;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .balloon-btn::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            background: rgba(255,255,255,0.28);
            border-radius: 50%;
            top: 16px;
            left: 24px;
        }

        .balloon-btn::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 42px;
            background: rgba(58, 21, 74, 0.5);
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
        }

        .balloon-btn:hover {
            transform: translateY(-8px) scale(1.06);
            filter: brightness(1.08);
        }

        .balloon-btn span {
            position: relative;
            z-index: 2;
            width: 80px;
            text-align: center;
            line-height: 1.2;
            font-size: 0.88rem;
        }

        @keyframes floatBalloon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes paperBurst {
            0% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0.5); }
            20% { opacity: 1; }
            100% { opacity: 0.95; transform: translate(var(--x, 0px), var(--y, -50px)) rotate(24deg) scale(1.1); }
        }

        @keyframes pageEnter {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="paper-pop">
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
    </div>

    <div class="card">
        <div class="heart">♥</div>
        <h1>Happy Birthday</h1>
        <p>To the most beautiful sister, this surprise is just for you.</p>
        <a class="balloon-btn" href="intex.html"><span>Open Surprise</span></a>
    </div>
</body>
</html>

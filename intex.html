<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sister</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #2b0a3f 0%, #4b1d68 28%, #6b2b94 60%, #8e5bcf 100%);
            overflow: hidden;
        }

        .paper-pop {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .paper {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            opacity: 0;
            animation: paperBurst 1.2s ease forwards;
            background: rgba(255,255,255,0.35);
        }

        .paper:nth-child(1) { left: 12%; top: 18%; background: #d5a5ff; animation-delay: 0.1s; }
        .paper:nth-child(2) { left: 22%; top: 12%; background: #f2d5ff; animation-delay: 0.15s; }
        .paper:nth-child(3) { left: 32%; top: 26%; background: #b98af7; animation-delay: 0.2s; }
        .paper:nth-child(4) { left: 43%; top: 14%; background: #d9b8ff; animation-delay: 0.25s; }
        .paper:nth-child(5) { left: 55%; top: 23%; background: #a56ae8; animation-delay: 0.3s; }
        .paper:nth-child(6) { left: 68%; top: 18%; background: #e8d3ff; animation-delay: 0.35s; }
        .paper:nth-child(7) { left: 80%; top: 24%; background: #c18dff; animation-delay: 0.4s; }
        .paper:nth-child(8) { left: 17%; top: 68%; background: #e8d3ff; animation-delay: 0.45s; }
        .paper:nth-child(9) { left: 28%; top: 71%; background: #a76fff; animation-delay: 0.5s; }
        .paper:nth-child(10) { left: 42%; top: 78%; background: #d9b8ff; animation-delay: 0.55s; }
        .paper:nth-child(11) { left: 57%; top: 72%; background: #d5a5ff; animation-delay: 0.6s; }
        .paper:nth-child(12) { left: 74%; top: 75%; background: #f2d5ff; animation-delay: 0.65s; }

        .scene {
            position: relative;
            z-index: 1;
            width: min(90vw, 800px);
            padding: 40px 30px;
            animation: pageEnter 0.9s ease-out;
        }

        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.28);
            border-radius: 28px;
            padding: 50px 30px 40px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(22, 7, 33, 0.35);
            z-index: 2;
        }

        .birthday {
            font-size: clamp(2.5rem, 6vw, 5rem);
            color: #f4e7ff;
            margin: 0;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
            letter-spacing: 1px;
        }

        .name {
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            color: #fff;
            margin: 12px 0 20px;
            font-weight: bold;
        }

        .message {
            font-size: clamp(1rem, 2.2vw, 1.3rem);
            color: #f4e7ff;
            line-height: 1.8;
            max-width: 650px;
            margin: 0 auto;
            display: none;
        }

        .heart-icon {
            font-size: 6rem;
            color: #f8d7ff;
            margin: 10px 0 12px;
            text-shadow: 0 0 22px rgba(255, 255, 255, 0.5);
            animation: pulseHeart 1.7s ease-in-out infinite;
        }

        .sparkle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.8);
            animation: float 7s linear infinite;
        }

        .sparkle:nth-child(1) { top: 10%; left: 12%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 18%; right: 14%; animation-delay: 1.2s; }
        .sparkle:nth-child(3) { bottom: 16%; left: 20%; animation-delay: 2.5s; }
        .sparkle:nth-child(4) { bottom: 12%; right: 22%; animation-delay: 3.5s; }
        .sparkle:nth-child(5) { top: 45%; left: 8%; animation-delay: 4.8s; }
        .sparkle:nth-child(6) { top: 42%; right: 9%; animation-delay: 5.7s; }

        .heart-btn {
            position: relative;
            width: 130px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            color: white;
            background: linear-gradient(180deg, #d9a4ff, #8d4df2);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: 0 12px 22px rgba(37, 7, 56, 0.28);
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
            animation: floatBalloon 3s ease-in-out infinite;
        }

        .heart-btn::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            background: rgba(255,255,255,0.28);
            border-radius: 50%;
            top: 16px;
            left: 24px;
        }

        .heart-btn::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 40px;
            background: rgba(120, 15, 56, 0.45);
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
        }

        .heart-btn:hover {
            transform: translateY(-8px) scale(1.06);
            filter: brightness(1.08);
            box-shadow: 0 18px 28px rgba(120, 15, 56, 0.28);
        }

        .heart-btn span {
            position: relative;
            z-index: 2;
            width: 80px;
            text-align: center;
            line-height: 1.2;
            font-size: 0.9rem;
            text-shadow: 0 2px 6px rgba(0,0,0,0.18);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes floatBalloon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.2;
            }
            50% {
                transform: translateY(-22px) scale(1.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-40px) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes paperBurst {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg) scale(0.5);
            }
            20% {
                opacity: 1;
            }
            100% {
                opacity: 0.95;
                transform: translate(var(--x, 0px), var(--y, -50px)) rotate(24deg) scale(1.1);
            }
        }

        @keyframes pageEnter {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="paper-pop">
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
        <span class="paper"></span>
    </div>

    <div class="scene">
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>

        <div class="card">
            <div class="heart-icon">♥</div>
            <h1 class="birthday">Happy Birthday</h1>
            <div class="name">Kuttima</div>
            <p class="message">
                You are the sunshine in my life, the smile in my hardest days, and the best sister anyone could ever ask for.
            </p>

            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;">
                <a class="heart-btn" href="gallery.html"><span>Next</span></a>
            </div>
        </div>
    </div>
</body>
</html>
